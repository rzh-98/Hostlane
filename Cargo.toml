[workspace]
resolver = "3"
members = ["crates/hostlane-protocol", "crates/hostlane-core", "crates/hostlane-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.89"

[workspace.dependencies]
hostlane-protocol = { path = "crates/hostlane-protocol" }
hostlane-core = { path = "crates/hostlane-core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
data-encoding = "2"
dirs = "6"
getrandom = "0.4"
glob = "0.3"
hmac = "0.13"
rusqlite = { version = "0.43", features = ["bundled"] }
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
sha2 = "0.11"
similar = "2"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "sync", "time", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ts-rs = "11"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
