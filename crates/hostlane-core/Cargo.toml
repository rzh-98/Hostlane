[package]
name = "hostlane-core"
description = "Hostlane daemon: SSH connection pool, tunnels, port discovery, policy and audit."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
hostlane-protocol.workspace = true
dirs.workspace = true
glob.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tracing.workspace = true
data-encoding.workspace = true
getrandom.workspace = true
hmac.workspace = true
keyring.workspace = true
rusqlite.workspace = true
russh.workspace = true
russh-sftp.workspace = true
rustls.workspace = true
sha1.workspace = true
sha2.workspace = true
similar.workspace = true
zeroize.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(unix)'.dependencies]
tokio = { workspace = true, features = ["process"] }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = "0.3.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_Security_Authorization", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
