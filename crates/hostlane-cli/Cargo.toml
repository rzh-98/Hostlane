[package]
name = "hostlane-cli"
default-run = "hostlane"
description = "The `hostlane` command: CLI for agents and people, and the daemon entry point."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "hostlane"
path = "src/main.rs"

[dependencies]
hostlane-core.workspace = true
hostlane-protocol.workspace = true
anyhow.workspace = true
clap.workspace = true
dirs.workspace = true
rmcp.workspace = true
rpassword.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
tempfile = "3"
toml_edit = "0.25"
tokio = { workspace = true, features = ["io-std"] }
tracing.workspace = true
tracing-subscriber.workspace = true
zeroize.workspace = true

[build-dependencies]
cc = "1"
