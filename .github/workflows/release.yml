name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (arm64)
            os: macos-latest
            dist: dist:mac
            target: aarch64-apple-darwin
          - name: Linux (x64)
            os: ubuntu-latest
            dist: dist:linux
            target: x86_64-unknown-linux-gnu
          - name: Windows (x64)
            os: windows-latest
            dist: dist:win
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Verify desktop, CLI and tag versions
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          cli=$(cargo metadata --locked --no-deps --format-version 1 | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).packages.find(p => p.name === 'hostlane-cli').version")
          test "$version" = "$cli"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then test "$GITHUB_REF_NAME" = "v$version"; fi

      - name: Install
        run: npm ci

      - name: Build CLI, typecheck and package
        run: npm run ${{ matrix.dist }} -- --publish never

      - name: Smoke test (launch packaged app)
        if: runner.os != 'Linux'
        run: node scripts/smoke.mjs screenshot-${{ runner.os }}.png

      - name: Smoke test (launch packaged app)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          xvfb-run --auto-servernum node scripts/smoke.mjs screenshot-${{ runner.os }}.png

      - name: Archive the CLI
        if: runner.os != 'Windows'
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          name="hostlane-${version}-${{ matrix.target }}"
          mkdir -p "cli/${name}"
          cp ../../target/release/hostlane ../../LICENSE ../../README.md "cli/${name}/"
          tar -C cli -czf "cli/${name}.tar.gz" "${name}"
          cd cli && shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"

      - name: Archive the Windows CLI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Path cli | Out-Null
          $zip = "cli/hostlane-$version-${{ matrix.target }}.zip"
          Compress-Archive -Path ../../target/release/hostlane.exe,../../target/release/hostlane-background.exe,../../LICENSE,../../README.md -DestinationPath $zip
          "$((Get-FileHash $zip -Algorithm SHA256).Hash)  $(Split-Path -Leaf $zip)" | Set-Content "$zip.sha256"

      - name: Upload installers and CLI
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          if-no-files-found: error
          path: |
            apps/desktop/release/*/*.dmg
            apps/desktop/release/*/*.zip
            apps/desktop/release/*/*.AppImage
            apps/desktop/release/*/*-setup.exe
            apps/desktop/cli/*.zip
            apps/desktop/cli/*.tar.gz
            apps/desktop/cli/*.sha256

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-${{ matrix.target }}
          if-no-files-found: ignore
          path: apps/desktop/screenshot-${{ runner.os }}.png

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/**/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            Download Hostlane ${{ github.ref_name }} for macOS (Apple Silicon), Windows (x64) or Linux (x64) from the assets below. Installers are unsigned; macOS builds are not notarized. Installation and upgrades are manual.
