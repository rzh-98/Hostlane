# Packaging config. Product name and version come from package.json.
appId: com.hostlane.app
directories:
  buildResources: build
  output: release/${version}
files:
  - out/**/*
  - resources/**/*
  - package.json
  - '!**/*.map'
asarUnpack:
  - resources/**
mac:
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
win:
  target:
    - nsis
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  target:
    - AppImage
  category: Utility
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
