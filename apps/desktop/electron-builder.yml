# Packaging config. Product name and version come from package.json.
appId: com.hostlane.app
directories:
  buildResources: build
  output: release/${version}
files:
  - out/**/*
  - resources/**/*
  - package.json
  - '!**/*.map'
asarUnpack:
  - resources/**
# The hostlane CLI and daemon, built by `npm run build:cli`; main/daemon.ts runs it from
# resources/bin. The daemon needs a Unix socket, so Windows builds do not bundle it yet.
mac:
  category: public.app-category.developer-tools
  extraResources:
    - from: ../../target/release/hostlane
      to: bin/hostlane
  target:
    - dmg
    - zip
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
win:
  target:
    - nsis
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  extraResources:
    - from: ../../target/release/hostlane
      to: bin/hostlane
  target:
    - AppImage
  category: Utility
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
