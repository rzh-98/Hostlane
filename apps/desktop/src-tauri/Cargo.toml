[workspace]
resolver = "3"

[package]
name = "hostlane-desktop"
version = "1.0.3"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
rfd = "0.15"
tokio = { version = "1", features = ["io-util", "process", "time", "sync"] }
serde_json = "1"
tempfile = "3"
dirs = "6"
hostlane-core = { path = "../../../crates/hostlane-core" }
hostlane-protocol = { path = "../../../crates/hostlane-protocol" }

[target.'cfg(windows)'.dependencies]
base64 = "0.22"

[features]
custom-protocol = ["tauri/custom-protocol"]
